goal_direction: |
  소소 건축사사무소는 일상 속 작은 가치에서 건축의 가능성을 찾습니다.
  건축은 단순히 공간을 만드는 일이 아니라, 사람과 도시,
  그리고 그 안에서 이루어지는 삶을 담아내는 과정이라고 생각합니다.

  우리는 주변의 환경과 장소가 가진 고유한 특성을 존중하며,
  사용자의 삶에 자연스럽게 스며드는 공간을 고민합니다.
  작은 것의 가치를 발견하고, 그 가치를 건축으로 실현하는 것.
  그것이 소소 건축사사무소가 추구하는 설계의 방향입니다.

  건축은 공간을 넘어 사람과 도시를 생각하는 일입니다.
  장소가 가진 맥락과 주변 환경을 읽고, 그 안에서 필요한
  공공성과 지속가능성을 고민합니다.

  자연과 조화를 이루는 패시브 디자인, 재료의 물성과 구축 방식,
  목구조와 시공의 합리성, 그리고 건축물의 유지관리까지
  설계의 모든 과정에서 함께 생각합니다.

  소소는 좋은 건축이 거창한 형태에서 시작되는 것이 아니라,
  일상에 대한 세심한 관찰과 작은 배려에서 시작된다고 믿습니다.
principal: >-
  마 순 석

  건축공학을 전공하고 건축전문대학원에서 건축디자인을 공부하다. 졸업 후 국내 건축사사무소에서 공공건축물의 현상설계와 실시설계 업무를
  수행하였다.정부청사, 도서관, 학교, 병원, 복지시설, 방송국, 전시관 등 다양한 프로젝트를 경험하였으며, 도시재생과 리모델링, 주거 및
  근린생활시설까지 다양한 건축 업무를 수행하였다.


  주요 관심사는 도시에서 공공성과 건축물과의 관계와 역할에 대하여 주목하고 있으며, 현실적 가능성에 대한 참신한  아이디어를 모색하고 있다.
  또한 지속가능한 건축환경과 관련하여 패시브, 재료, 목구조, 시공방법, 유지관리 등 사람이 건축환경에서 건강하게 생활할 수 있는 건축공간을
  구현하는데 지속적인 연구를 하고 있다. 


  건축사로서 의미있는 작업과 지역사회에 가치있는 역할을 하고 싶어 2022년 소소 건축사사무소를 개소했으며, 현재는 구로구 건축위원회 위원으로
  활동중이다.  개소 후에는 건축설계외에 공사감리, 해체감리, 용도변경 등  일상과 밀접한 소규모건축물의 다양한 참여를 통해 실제적인 현장과
  설계와의 간극을 좁히려고 노력하고 있다. 


  - 건축사(KIRA)

  - 건축기사

  - 한양대학교 건축전문대학원 졸업(석사)
