introduction: |-
  소소 건축사사무소는 작은것의 가치를 추구합니다.
  건축의 본질과 장소의 특성을 존중하며,
  일상에 오래 머무는 공간을 만들어 갑니다.
greeting: |-
  **대표 마순석 | Registered Architect**

  건축공학을 전공하고 한양대학교 건축전문대학원에서
  건축디자인을 공부하였습니다.

  졸업 후 국내 건축사사무소에서 공공건축물의
  현상설계와 실시설계 업무를 수행하였습니다.

  정부청사, 도서관, 학교, 병원, 복지시설,
  방송국, 전시관 등 다양한 프로젝트를 경험하였으며,
  도시재생과 리모델링, 주거 및 근린생활시설까지
  다양한 건축 업무를 수행하고 있습니다.
