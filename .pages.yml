media:
  input: images
  output: /images
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: projects
    label: 프로젝트 관리
    type: file
    path: data/projects.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: 프로젝트명
        type: string
      - name: category
        label: 프로젝트 구분
        type: select
        options:
          values:
            - 공공건축
            - 일반건축
            - 용도변경
      - name: thumbnail
        label: 썸네일 이미지
        type: image
      - name: images
        label: 상세 이미지
        type: image
        list: true
      - name: description
        label: 프로젝트 설명
        type: text

  - name: soso
    label: 사무소 소개
    type: file
    path: data/soso.yml
    format: yaml
    fields:
      - name: goal_direction
        label: 목표와 방향
        type: text
      - name: principal
        label: 대표 소개
        type: text
      - name: career
        label: 주요 경력
        type: text
        description: 경력 내용을 자유롭게 입력하세요.
      - name: activities
        label: 주요 활동
        type: text
        description: 활동 내용을 자유롭게 입력하세요.
      - name: other
        label: 기타
        type: text
        description: 필요할 때 자유롭게 추가 설명을 입력하세요. 비워두면 홈페이지에 표시되지 않습니다.
      - name: location
        label: 주소
        type: text
      - name: contact_phone
        label: 전화
        type: string
      - name: contact_fax
        label: 팩스
        type: string
      - name: contact_email
        label: 이메일
        type: string
