* {

}

body {

}

header {
  height: 125px;

}

.logo {

}

.logo-korean {

.logo-english {

.main-nav {

  font-weight: 500;
  letter-spacing: 1px;
  color: #222;
}

main {
  max-width: 1500px;
  margin: 25px auto 90px;
  padding: 0 3%;
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.project {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border: 0;
  padding: 0;
  background: #ddd;
  cursor: pointer;
}

.project img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
}

.project::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.30);
  transition: background .35s ease;
}

.project:hover img {
  transform: scale(1.06);
}

.project:hover::after {
  background: rgba(0,0,0,.48);
}

.project-name {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  color: #fff;
  text-align: center;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 1px;
  text-shadow: 0 1px 5px rgba(0,0,0,.4);
}

/* 하단 연락처 */
footer {
  padding: 14px 20px 8px;
  border-top: none;
  text-align: center;
  color: #222;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.2;
}

.footer-info {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  gap: 0 14px;
  white-space: nowrap;
  overflow-x: auto;
  color: #333;
  font-size: 13px;
  line-height: 1.3;
}

.footer-info a {
  color: #222;
  text-decoration: none;
}

.copyright {
  margin-top: 3px;
  padding-top: 0;
  color: #444;
  font-size: 11px;
  line-height: 1.2;
}

/* 프로젝트 상세 팝업 */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.88);
  padding: 30px 18px;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  position: relative;
  width: min(950px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
}

.modal-image {
  display: block;
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  background: #eee;
}

.modal-info {
  padding: 25px 30px 30px;
}

.modal-info h2 {
  font-size: 21px;
  font-weight: 500;
  margin-bottom: 12px;
}

.modal-info p {
  font-size: 14px;
  color: #777;
  line-height: 1.8;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  z-index: 3;
  width: 42px;
  height: 42px;
  border: 0;
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 30px;
  cursor: pointer;
}

/* 태블릿 */
@media (max-width: 800px) {
  header {
    height: 110px;

/* 스마트폰 */

    font-size: 10px;

  }

  }
}

<div class="modal" id="projectModal"
     role="dialog" aria-modal="true"
     aria-labelledby="modalTitle">

  <div class="modal-content">
    <button class="close" id="closeModal"
            aria-label="닫기">&times;</button>

    <img class="modal-image" id="modalImage" src="" alt="">

    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById("projectModal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalDescription = document.getElementById("modalDescription");

document.querySelectorAll(".project").forEach(project => {
  project.addEventListener("click", () => {
    modalTitle.textContent = project.dataset.title;
    modalDescription.textContent = project.dataset.description;
    modalImage.src = project.dataset.image;
    modalImage.alt = project.dataset.title;

    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("closeModal").focus();
  });
});

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("closeModal")
  .addEventListener("click", closeModal);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});
</script>
