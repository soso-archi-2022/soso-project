<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #fff;
  color: #222;
}

header {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
}

.logo {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -1px;
}

.logo span {
  color: #d87932;
}

.logo small {
  display: block;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 2px;
  margin-top: 4px;
}

.header-right {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #777;
}

main {
  max-width: 1500px;
  margin: 65px auto 100px;
  padding: 0 6%;
}

.section-title {
  text-align: center;
  font-size: 27px;
  font-weight: 500;
  letter-spacing: 5px;
  margin-bottom: 55px;
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.project {
  position: relative;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  cursor: pointer;
  background: #ddd;
  border: 0;
  width: 100%;
  display: block;
}

.project img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .5s ease;
}

.project::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.28);
  transition: background .35s ease;
}

.project:hover img {
  transform: scale(1.06);
}

.project:hover::after {
  background: rgba(0,0,0,.48);
}

.project-name {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  text-align: center;
  color: #fff;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 1px;
  text-shadow: 0 1px 5px rgba(0,0,0,.35);
}

footer {
  padding: 35px 6%;
  border-top: 1px solid #eee;
  text-align: center;
  color: #999;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2;
}

/* 프로젝트 상세 팝업 */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.88);
  padding: 35px 18px;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  width: min(950px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  position: relative;
}

.modal-image {
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  display: block;
  background: #eee;
}

.modal-info {
  padding: 25px 30px 30px;
}

.modal-info h2 {
  font-size: 21px;
  font-weight: 500;
  margin-bottom: 12px;
}

.modal-info p {
  font-size: 14px;
  color: #777;
  line-height: 1.8;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  z-index: 3;
  border: 0;
  background: rgba(0,0,0,.5);
  color: #fff;
  font-size: 30px;
  width: 42px;
  height: 42px;
  cursor: pointer;
}

@media (max-width: 800px) {
  .project-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
  }

  main {
    margin-top: 45px;
  }

  .section-title {
    margin-bottom: 35px;
  }
}

@media (max-width: 480px) {
  header {
    height: 75px;
  }

  .project-grid {
    grid-template-columns: 1fr;
  }

  .project-name {
    font-size: 16px;
  }

  main {
    padding: 0 5%;
  }
}
</style>
</head>

</footer>

<div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <button class="close" id="closeModal" aria-label="닫기">&times;</button>
    <img class="modal-image" id="modalImage" src="" alt="">
    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById("projectModal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalDescription = document.getElementById("modalDescription");

document.querySelectorAll(".project").forEach(project => {
  project.addEventListener("click", () => {
    modalTitle.textContent = project.dataset.title;
    modalDescription.textContent = project.dataset.description;
    modalImage.src = project.dataset.image;
    modalImage.alt = project.dataset.title;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("closeModal").focus();
  });
});

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("closeModal").addEventListener("click", closeModal);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});
</script>
