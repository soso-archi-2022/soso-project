<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #fff;
  color: #222;
}

/* 상단 사무소 로고 */
header {
  height: 125px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
}

.logo {
  text-align: center;
}

.logo-korean {
  white-space: nowrap;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -1.2px;
  line-height: 1.4;
  color: #333;
}

.logo-korean span {
  color: #477653;
}

.logo small {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 3px;
  color: #777;
}

/* 프로젝트 영역 */
main {
  max-width: 1500px;
  margin: 25px auto 90px;
  padding: 0 3%;
}

.section-title {
  text-align: center;
  font-size: 27px;
  font-weight: 500;
  letter-spacing: 5px;
  margin-bottom: 48px;
}

/* 프로젝트 썸네일 */
.project-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.project {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border: 0;
  padding: 0;
  background: #ddd;
  cursor: pointer;
}

.project img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
}

.project::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.30);
  transition: background .35s ease;
}

.project:hover img {
  transform: scale(1.06);
}

.project:hover::after {
  background: rgba(0,0,0,.48);
}

.project-name {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  color: #fff;
  text-align: center;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 1px;
  text-shadow: 0 1px 5px rgba(0,0,0,.4);
}

/* 하단 */
footer {
  padding: 35px 15px;
  border-top: 1px solid #eee;
  text-align: center;
  color: #999;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2;
}

/* 프로젝트 상세 팝업 */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.88);
  padding: 30px 18px;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  position: relative;
  width: min(950px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
}

.modal-image {
  display: block;
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  background: #eee;
}

.modal-info {
  padding: 25px 30px 30px;
}

.modal-info h2 {
  font-size: 21px;
  font-weight: 500;
  margin-bottom: 12px;
}

.modal-info p {
  font-size: 14px;
  color: #777;
  line-height: 1.8;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  z-index: 3;
  width: 42px;
  height: 42px;
  border: 0;
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 30px;
  cursor: pointer;
}

/* 태블릿 */
@media (max-width: 800px) {
  header {
    height: 110px;
  }

  .project-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  main {
    margin-top: 25px;
  }

  .section-title {
    margin-bottom: 35px;
  }
}

/* 모바일 */
@media (max-width: 480px) {
  header {
    height: 100px;
  }

  .logo-korean {
    font-size: 21px;
  }

  .project-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .project-name {
    font-size: 13px;
  }

  main {
    padding: 0 4%;
  }

  .section-title {
    font-size: 23px;
  }

  .modal-info {
    padding: 20px;
  }
}
</style>
</head>

</footer>

<!-- 이미지 확대 팝업 -->
<div class="modal" id="projectModal"
     role="dialog" aria-modal="true"
     aria-labelledby="modalTitle">

  <div class="modal-content">
    <button class="close" id="closeModal"
            aria-label="닫기">&times;</button>

    <img class="modal-image" id="modalImage" src="" alt="">

    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById("projectModal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalDescription = document.getElementById("modalDescription");

document.querySelectorAll(".project").forEach(project => {
  project.addEventListener("click", () => {
    modalTitle.textContent = project.dataset.title;
    modalDescription.textContent = project.dataset.description;
    modalImage.src = project.dataset.image;
    modalImage.alt = project.dataset.title;

    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("closeModal").focus();
  });
});

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("closeModal")
  .addEventListener("click", closeModal);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});
</script>
